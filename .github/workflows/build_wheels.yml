name: Build Android Wheels

on:
  workflow_dispatch:
    inputs:
      pydantic_core_ref:
        description: >-
          Git ref to build, resolved against source_repo. Can be "main", a
          branch, a tag (e.g. v2.41.5) or a commit SHA. check_upstream.yml
          always passes an exact commit SHA here.
        required: true
        default: "main"
      source_repo:
        description: >-
          Repo to build from. Use pydantic/pydantic for the monorepo (new
          versions, e.g. 2.50+). Use pydantic/pydantic-core for older tags
          (e.g. v2.41.5), where the crate lives at the repo root.
        required: false
        default: "pydantic/pydantic"
      manifest_path:
        description: >-
          Path to pydantic-core's Cargo.toml inside source_repo. Monorepo:
          pydantic-core/Cargo.toml. Old standalone repo: Cargo.toml.
        required: false
        default: "pydantic-core/Cargo.toml"
      release_version:
        description: >-
          Exact pydantic-core version this ref corresponds to. Set
          automatically by check_upstream.yml. Leave empty for an ad hoc
          build - a release is only published when this resolves to a
          non-empty value (either from this input directly, or parsed
          from pydantic_core_ref if it happens to look like a version).
          If set, the build fails when Cargo.toml's version does not match.
        required: false
        default: ""
      dry_run:
        description: "Build and smoke-test only; never publish a GitHub Release."
        required: false
        default: false
        type: boolean

permissions:
  contents: write
  actions: write

env:
  ANDROID_API_LEVEL: 24
  NDK_VERSION: "26.3.11579264"

jobs:
  discover:
    runs-on: ubuntu-latest
    outputs:
      python_version: ${{ steps.discover.outputs.python_version }}
      release_version: ${{ steps.resolve_ref.outputs.release_version }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install ci_tool
        run: pip install -e ./ci_tool

      - id: discover
        name: Discover currently-served Termux python version
        run: |
          python -m ci_tool discover-python-version \
            --abi arm64-v8a \
            --github-output "$GITHUB_OUTPUT"

      - id: resolve_ref
        name: Resolve the release version for this build, if any
        run: |
          python -m ci_tool resolve-ref \
            --ref "${{ inputs.pydantic_core_ref }}" \
            --version "${{ inputs.release_version }}" \
            --github-output "$GITHUB_OUTPUT"

      - run: echo "Building against Termux python ${{ steps.discover.outputs.python_version }}"

  build:
    needs: discover
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        android_abi: [arm64-v8a, armeabi-v7a, x86_64, x86]
    steps:
      - uses: actions/checkout@v4

      - name: Checkout pydantic-core source
        uses: actions/checkout@v4
        with:
          repository: ${{ inputs.source_repo }}
          ref: ${{ inputs.pydantic_core_ref }}
          path: core-src

      - name: Verify Cargo.toml version matches release_version
        env:
          MANIFEST: core-src/${{ inputs.manifest_path }}
          EXPECTED: ${{ needs.discover.outputs.release_version }}
        run: |
          if [ ! -f "$MANIFEST" ]; then
            echo "::error::Manifest not found: $MANIFEST (check source_repo / manifest_path / ref)"
            exit 1
          fi
          ACTUAL=$(grep -m1 -E '^version[[:space:]]*=' "$MANIFEST" | sed -E 's/.*"([^"]+)".*/\1/' || true)
          echo "Cargo.toml version: ${ACTUAL:-<not found>}"
          if [ -n "$EXPECTED" ] && [ -n "$ACTUAL" ] && [ "$ACTUAL" != "$EXPECTED" ]; then
            echo "::error::Version mismatch: Cargo.toml has $ACTUAL but release_version is $EXPECTED"
            exit 1
          fi

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install ci_tool
        run: pip install -e ./ci_tool

      - name: Install Rust targets
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: >-
            aarch64-linux-android
            armv7-linux-androideabi
            x86_64-linux-android
            i686-linux-android

      - name: Install maturin + binutils + patchelf
        run: |
          pip install maturin
          sudo apt-get update
          sudo apt-get install -y patchelf binutils

      - name: Install Android NDK
        uses: nttld/setup-ndk@v1
        id: ndk
        with:
          ndk-version: r26d

      - name: Build + patch + retag wheel
        run: |
          python -m ci_tool build \
            --abi ${{ matrix.android_abi }} \
            --python-version ${{ needs.discover.outputs.python_version }} \
            --android-api-level ${{ env.ANDROID_API_LEVEL }} \
            --ndk-home ${{ steps.ndk.outputs.ndk-path }} \
            --manifest-path core-src/${{ inputs.manifest_path }} \
            --out-dir dist \
            --cache-dir .ci-cache \
            --github-output "$GITHUB_OUTPUT"

      - uses: actions/upload-artifact@v4
        with:
          name: wheel-${{ matrix.android_abi }}-py${{ needs.discover.outputs.python_version }}
          path: |
            dist/*.whl
            dist/*.whl.json

  smoke-test:
    needs: [discover, build]
    strategy:
      fail-fast: false
      matrix:
        include:
          - android_abi: arm64-v8a
            runner: ubuntu-24.04-arm
          - android_abi: armeabi-v7a
            runner: ubuntu-24.04-arm
          - android_abi: x86_64
            runner: ubuntu-24.04
          - android_abi: x86
            runner: ubuntu-24.04
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install ci_tool
        run: pip install -e ./ci_tool

      - uses: actions/download-artifact@v4
        with:
          pattern: wheel-${{ matrix.android_abi }}-*
          path: dist
          merge-multiple: true

      - name: Smoke test against real termux-docker
        run: |
          python -m ci_tool smoke-test \
            --abi ${{ matrix.android_abi }} \
            --wheel-dir dist

  release-notes:
    needs: [discover, build, smoke-test]
    if: needs.discover.outputs.release_version != '' && inputs.dry_run != true
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -e ./ci_tool

      - name: Render release notes
        run: |
          python -m ci_tool release-notes \
            --dist-dir dist \
            --pydantic-core-version "${{ needs.discover.outputs.release_version }}" \
            --ndk-version "${{ env.NDK_VERSION }}" \
            --android-api-level ${{ env.ANDROID_API_LEVEL }} \
            --maturin-version "$(pip index versions maturin 2>/dev/null | head -1 || echo unknown)" \
            --output release_body.md

      - uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ needs.discover.outputs.release_version }}
          body_path: release_body.md
          files: dist/**/*.whl

      - name: Trigger PyPI index rebuild
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gh workflow run update_index.yml --ref ${{ github.ref_name }}
